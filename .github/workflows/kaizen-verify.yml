name: kaizen-verify

on:
  push:
    branches: [p2.3-shared-pipeline-cache, "arena/**"]
  pull_request:
    branches: [p2.3-shared-pipeline-cache]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          python3 -m pip install --user scons zstandard
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Regenerate build-time headers
        run: bash tools/regen_gen_headers.sh

      - name: Fetch pinned open-source SDK sources
        run: |
          python3 tools/sdk/sdk_manager.py --download lua/lua
          python3 tools/sdk/sdk_manager.py --download physx/physx

      - name: Test suite (standalone subsystem and metadata checks)
        run: bash tests/kaizen/run_tests.sh

      - name: Build PhysX SDK group
        run: ./build.sh physx

      - name: Build Lua script group
        run: ./build.sh lua

      - name: PhysX runtime smoke test
        run: bash tests/kaizen/run_physx_smoke.sh

      - name: Lua runtime smoke test
        run: bash tests/kaizen/run_lua_smoke.sh
