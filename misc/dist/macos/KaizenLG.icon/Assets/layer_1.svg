<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!-- Fundo preto -->
  <rect width="100" height="100" fill="#000000" />
  
  <!-- Geometria da letra K -->
  <g fill="#F8F8F8">
    <!-- Haste vertical superior esquerda -->
    <polygon points="14,15 31,15 31,45 14,61" />
    
    <!-- Diagonal principal (do canto superior direito ao inferior esquerdo) -->
    <polygon points="69,15 90,15 31,72 31,85 14,85 14,68" />
    
    <!-- Perna diagonal inferior direita -->
    <polygon points="57,54 91,85 69,85 45,65" />
  </g>
</svg>